<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <style>
    body {
      background-color: #f4ede8;
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
    }

    h1 {
  color: #333;
    }
nav a {
    color: #6b5e55; 
    text-decoration: underline;
    font-weight: 500;
    padding: 5px 8px;
  }

  nav a:hover {
    text-decoration: underline;
  }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }

    nav ul {
      display: flex;
      gap: 20px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    /* スマホ用（幅600px以下） */
    @media (max-width: 600px) {
      header {
        flex-direction: column;
        gap: 15px;
      }

      nav ul {
        flex-direction: column;
        gap: 10px;
        text-align: center;
      }
    }
  </style>

</head>
<body>
  <header>
  <a href="index.html">
    <img src="images/logo.png" alt="logo" style="width:150px;">
  </a>

  <nav>
    <ul>
      <li><a href="concept.html">Concept</a></li>
      <li><a href="profile.html">Profile</a></li>
      <li><a href="works.html">Works</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
  </header>
  <!-- ここからページの内容 -->
<style>
  .mv-wrap {
    width: 100%;
    height: 520px; /* スマホ用（全身入る） */
    overflow: hidden;
  }

  .mv-wrap video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 40% 90%; /* 下寄りで全身入りやすく */
  }

  /* PC用に高さを調整 */
  @media (min-width: 768px) {
    .mv-wrap {
      height: 480px; /* PCでは少し低めにして頭が切れないように */
    }
  }
</style>

<div class="mv-wrap">
  <video autoplay muted loop playsinline>
    <source src="images/mainvisual.mp4" type="video/mp4">
  </video>
</div>
  </body>
</html>
