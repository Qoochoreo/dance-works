<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #e9e1f2;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }

    nav a {
      color: #6b5e55;
      text-decoration: underline;
      font-weight: 500;
      padding: 5px 8px;
    }

    nav ul {
      display: flex;
      gap: 20px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    /* スマホ用（幅600px以下） */
@media (max-width: 600px) {
  header {
    flex-direction: row; /* ← 縦並びにしない */
    justify-content: space-between;
    align-items: center;
    padding: 10px;
  }

  nav ul {
    flex-direction: row; /* ← 横並びに戻す */
    gap: 20px;
    text-align: right;
  }
}


    /* まず両方横幅いっぱいに */
    .img-pc img,
    .img-sp img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* PC用画像をデフォルトで表示、スマホ用は非表示 */
    .img-pc { display: block; }
    .img-sp { display: none; }

    /* スマホ（768px以下）では逆にする */
    @media (max-width: 768px) {
      .img-pc { display: none; }
      .img-sp { display: block; }
    }

    .footer {
      background-color: #e9e1f2;
      padding: 40px 0;
      text-align: center;
      color: #6b5a6e;
      font-size: 14px;
    }

    .footer .logo {
      font-size: 16px;
      margin-bottom: 5px;
      letter-spacing: 1px;
    }
@media (max-width: 600px) {
  .footer {
    text-align: center !important;
  }
}

    
  </style>
</head>

<body>

  <header>
    <a href="index.html">
      <img src="images/logo.png" alt="logo" style="width:150px;">
    </a>

    <nav>
      <ul>
        <li><a href="concept.html">Concept</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- ここからページの内容 -->
  
  <div class="img-pc">
    <img src="images/preparing.PC.png" alt="準備中（PC）">
  </div>

  <div class="img-sp">
    <img src="images/preparing.png" alt="準備中（スマホ）">
  </div>

  <footer class="footer">
    <div class="center">
      <p class="logo">Qoo choreo</p>
      <p class="copy">© 2026 QOO All Rights Reserved.</p>
    </div>
  </footer>

</body>
</html>
