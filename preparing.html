<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <style>
    body {
      background-color: #e9e1f2;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }

    nav a {
      color: #6b5e55;
      text-decoration: underline;
      font-weight: 500;
      padding: 5px 8px;
    }

    nav ul {
      display: flex;
      gap: 20px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    /* スマホ用（幅600px以下） */
    @media (max-width: 600px) {
      header {
        flex-direction: column;
        gap: 15px;
        padding: 10px;
      }

      nav ul {
        flex-direction: column;
        gap: 10px;
        text-align: center;
      }
    }


    .footer {
      background-color: #e9e1f2;
      padding: 40px 0;
      text-align: center;
      color: #6b5a6e;
      font-size: 14px;
    }

    .footer .logo {
      font-size: 16px;
      margin-bottom: 5px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html">
      <img src="images/logo.png" alt="logo" style="width:150px;">
    </a>

    <nav>
      <ul>
        <li><a href="concept.html">Concept</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- ここからページの内容 -->
  
<picture>
  <!-- PC用（画面幅768px以上） -->
  <source srcset="preparing.PC.png" media="(min-width: 768px)">
  
  <!-- スマホ用（デフォルト） -->
  <img src="preparing.png" alt="準備中">
</picture>

  <footer class="footer">
    <div class="center">
      <p class="logo">Qoo choreo</p>
      <p class="copy">© 2026 QOO All Rights Reserved.</p>
    </div>
  </footer>

</body>
</html>
